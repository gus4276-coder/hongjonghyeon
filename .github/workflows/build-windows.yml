name: Build Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller==6.*"

      - name: Smoke test imports
        run: python -c "import app.main, pyaudiowpatch, webrtcvad, soxr, webview; print('ok')"

      - name: PyInstaller
        shell: bash
        run: |
          set -o pipefail
          pyinstaller build/app.spec --noconfirm --distpath dist --workpath build/work 2>&1 | tee pyinstaller.log || {
            # 실패 원인을 로그인 없이 볼 수 있는 annotation 으로 남긴다
            grep -E "ERROR|Error|Traceback" pyinstaller.log | tail -n 15 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }
          test -f dist/HiplazaMeetingNotes/HiplazaMeetingNotes.exe

      - name: Version
        id: ver
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"; [[ "$GITHUB_REF_TYPE" == "tag" ]] || V="dev"
          echo "v=$V" >> "$GITHUB_OUTPUT"

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.v }}" build\installer.iss

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\HiplazaMeetingNotes\* -DestinationPath dist\HiplazaMeetingNotes-Portable-${{ steps.ver.outputs.v }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: HiplazaMeetingNotes-${{ steps.ver.outputs.v }}
          path: |
            dist/*.exe
            dist/*.zip

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
